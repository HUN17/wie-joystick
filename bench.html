<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bench</title></head>
<body style="font:16px -apple-system,sans-serif;padding:16px"><h3>JIT 측정</h3><pre id="out">측정 중...</pre>
<script>
const out = document.getElementById("out");
const log = s => { out.textContent += "\n" + s; };
setTimeout(async () => {
  out.textContent = "UA: " + navigator.userAgent + "\nsecure: " + window.isSecureContext;
  const N = 20000000;
  let t = performance.now(), a = 0;
  for (let i = 0; i < N; i++) a = (a + i * 3) ^ 7;
  log("JS loop: " + (performance.now() - t).toFixed(0) + " ms (" + (a & 1) + ")");
  const { instance } = await WebAssembly.instantiate(new Uint8Array([0,97,115,109,1,0,0,0,1,6,1,96,1,127,1,127,3,2,1,0,7,5,1,1,102,0,0,10,36,1,34,1,2,127,3,64,32,1,32,2,65,3,108,106,65,7,115,33,1,32,2,65,1,106,34,2,32,0,73,13,0,11,32,1,11]));
  instance.exports.f(1000);
  t = performance.now();
  const r = instance.exports.f(N);
  log("Wasm loop: " + (performance.now() - t).toFixed(0) + " ms (" + (r & 1) + ")");
}, 300);
</script></body></html>
